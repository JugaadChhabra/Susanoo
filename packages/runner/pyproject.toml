[project]
name = "susanoo-runner"
version = "0.1.0"
description = "Customer-side Susanoo runner: durable journal, side-effect-safe dispatch, observation, evaluation"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "uvicorn>=0.30",
    "susanoo-contracts",
    "susanoo-evaluator",
    "susanoo-sdk",
    "susanoo-simulator",
]

[project.scripts]
susanoo-runner = "susanoo_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["susanoo_runner"]
