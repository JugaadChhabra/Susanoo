[project]
name = "susanoo-connectors"
version = "0.1.0"
description = "Typed agent transports for Susanoo: sync/async HTTP, SSE, WebSocket and source intake"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "websockets>=13",
    "susanoo-contracts",
    "susanoo-evaluator",
    "susanoo-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["susanoo_connectors"]
