[project]
name = "susanoo-connectors"
version = "0.1.0"
description = "Typed agent transports for Susanoo: sync/async HTTP, SSE, WebSocket and source intake"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "websockets>=13",
    "susanoo-contracts",
    "susanoo-evaluator",
    "susanoo-sdk",
    "mcp>=2.3,<2.4",
    "httpx2>=2.13,<3",
    "jsonschema>=4.26",
    "protobuf>=5.29",
    "pyyaml>=6",
]

[project.optional-dependencies]
grpc = ["grpcio>=1.66"]
browser = ["playwright>=1.48"]
twilio = ["twilio>=9.3,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["susanoo_connectors"]
