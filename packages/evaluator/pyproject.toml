[project]
name = "susanoo-evaluator"
version = "0.1.0"
description = "Deterministic business-outcome check DSL, verdict and gate aggregation for Susanoo"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "susanoo-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["susanoo_evaluator"]
