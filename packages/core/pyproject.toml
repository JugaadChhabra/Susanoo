[project]
name = "susanoo-core"
version = "0.1.0"
description = "Susanoo shared Python package: heads, graph, scoring, sandbox, integrations"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "claude-agent-sdk>=0.2.165",
    "httpx>=0.27",
    "langgraph>=0.6",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["susanoo"]
