[project]
name = "susanoo-sdk"
version = "0.1.0"
description = "Agent, fixture and environment adapter interfaces plus the bounded JSONL bridge for Susanoo"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2",
    "susanoo-contracts",
    "susanoo-evaluator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["susanoo_sdk"]
