[project]
name = "susanoo-simulator"
version = "0.1.0"
description = "Stateful simulator: isolated fixture stores, permissions, idempotency, faults and a simulated clock"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2",
    "susanoo-contracts",
    "susanoo-evaluator",
    "susanoo-sdk",
]

[project.scripts]
susanoo-simulator = "susanoo_simulator.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["susanoo_simulator"]
