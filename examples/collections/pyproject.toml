[project]
name = "susanoo-collections-demo"
version = "0.1.0"
description = "Synthetic collections example for Susanoo acceptance tests"
requires-python = ">=3.12"
dependencies = ["susanoo-sdk", "susanoo-runner", "susanoo-simulator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collections_demo"]
