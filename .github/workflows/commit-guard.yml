name: commit-guard
# Server-side backstop for CLAUDE.md §3: only MuaazSM / JugaadChhabra may author commits,
# and no AI attribution trailers (Co-Authored-By: Claude, Claude-Session, "Generated with Claude Code").
on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit identities and messages
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          . .githooks/_lib.sh
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then range="$PR_BASE..$PR_HEAD"
          elif [ "$BEFORE" = "$zero" ] || [ -z "$BEFORE" ]; then range="-n 50 $AFTER"
          else range="$BEFORE..$AFTER"; fi
          fail=0
          for c in $(git rev-list $range); do
            an="$(git show -s --format='%an' $c)"; ae="$(git show -s --format='%ae' $c)"
            cn="$(git show -s --format='%cn' $c)"; ce="$(git show -s --format='%ce' $c)"
            is_allowed_identity "$an" "$ae" || { echo "::error::$c author '$an <$ae>' not allowed"; fail=1; }
            if ! is_allowed_identity "$cn" "$ce" && [ "$cn" != "GitHub" ]; then echo "::error::$c committer '$cn <$ce>' not allowed"; fail=1; fi
            git show -s --format='%B' $c > /tmp/msg
            if has_banned_lines /tmp/msg; then echo "::error::$c message contains AI attribution"; fail=1; fi
          done
          exit $fail
      - name: Check PR title and body
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          . .githooks/_lib.sh
          printf '%s\n%s\n' "$TITLE" "$BODY" > /tmp/pr
          if has_banned_lines /tmp/pr; then echo "::error::PR title/body contains AI attribution"; exit 1; fi
