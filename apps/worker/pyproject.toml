[project]
name = "susanoo-worker"
version = "0.1.0"
description = "Susanoo queue poller that runs the graph"
requires-python = ">=3.12"
dependencies = ["susanoo-core"]

[tool.uv.sources]
susanoo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["susanoo_worker"]
