[project]
name = "susanoo-api"
version = "0.1.0"
description = "Susanoo FastAPI control plane"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "susanoo-core",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
susanoo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["susanoo_api"]
