[project]
name = "susanoo-api"
version = "0.1.0"
description = "Susanoo FastAPI control plane"
requires-python = ">=3.12"
dependencies = [
    "susanoo-evaluator",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "susanoo-core",
    "susanoo-contracts",
    "reportlab>=4.4,<5",
    "boto3>=1.40,<2",
    "cryptography>=46,<51",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
susanoo-core = { workspace = true }
susanoo-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["susanoo_api"]
