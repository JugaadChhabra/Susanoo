# Production stack on EC2 (/opt/susanoo). Images are built and pushed by
# .github/workflows/deploy-backend.yml. Secrets live in /opt/susanoo/.env.
services:
  api:
    image: ghcr.io/jugaadchhabra/susanoo-api:latest
    env_file: /opt/susanoo/.env
    restart: unless-stopped
    expose:
      - "8000"

  worker:
    image: ghcr.io/jugaadchhabra/susanoo-worker:latest
    env_file: /opt/susanoo/.env
    restart: unless-stopped
    # Docker's 10 s default kills the worker before it can hand its runs back to the queue.
    stop_grace_period: 60s
    # The worker starts generated apps as sibling containers (capped, no mounts; sandbox/docker.py).
    # DOCKER_GID = the host's docker group id: `getent group docker | cut -d: -f3`, set in /opt/susanoo/.env.
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker_runs:/data/runs
    networks:
      - default
      - sandbox

  caddy:
    image: caddy:2
    env_file: /opt/susanoo/.env
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - default
      - sandbox   # proxies run-<id> previews to the generated-app containers (#4)

# Generated-app containers join only this network, never api or Postgres.
networks:
  sandbox:
    name: susanoo_sandbox

volumes:
  caddy_data:
  caddy_config:
  worker_runs:
