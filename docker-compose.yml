# Production stack on EC2 (/opt/susanoo). Images are built and pushed by
# .github/workflows/deploy-backend.yml. Secrets live in /opt/susanoo/.env.
services:
  api:
    image: ghcr.io/jugaadchhabra/susanoo-api:latest
    env_file: /opt/susanoo/.env
    restart: unless-stopped
    expose:
      - "8000"

  worker:
    image: ghcr.io/jugaadchhabra/susanoo-worker:latest
    env_file: /opt/susanoo/.env
    restart: unless-stopped
    # Docker's 10 s default kills the worker before it can hand its runs back to the queue.
    stop_grace_period: 60s

  caddy:
    image: caddy:2
    env_file: /opt/susanoo/.env
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
