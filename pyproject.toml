[project]
name = "susanoo"
version = "0.1.0"
description = "Susanoo workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/core"]

[tool.uv.sources]
susanoo-core = { workspace = true }
susanoo-api = { workspace = true }
susanoo-worker = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "susanoo-core",
    "susanoo-api",
    "susanoo-worker",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["apps/web", "templates"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
